handoff_notes:
  - "需求修订 v2 已确认：网页登录授权、refresh token、管理员 API Key x-api-key；普通账号分组严格取 /groups/available。"
  - "下一步使用真实 Sub2API 站点做只读联调。"
  - "浏览器预览不执行网页登录授权；真实授权请使用桌面快捷入口。"
  - "桌面端 preload 已改为 CommonJS index.cjs，避免 sandbox 下 ESM preload 加载失败。"
  - "网页登录授权加载失败码 -3 被忽略为重定向中断，避免误报失败。"
  - "站点 session fingerprint 校验需要同步携带 cookie 与 UA。"
  - "错误态按钮应区分重试当前站点与重新登录。"
  - "v7 已加入每秒倒计时 tick、Sub2API 分类 tabs、站点级充值比例和低价聚合比较。"
  - "v8 已将首页改为分类驱动 token 比价榜，站点信息降级为来源钱包。"
  - "v3-2 已把价格榜表头做成可点击排序按钮，支持倍率、充值比例和有效成本切换升降序；排序状态仅保留在 renderer 本地 UI。"
  - "v3-2 补充完成紧凑视图排序胶囊条；compact 和窄屏下排序控件独立显示，表头退回静态标签。"
  - "v4-1 新增最终倍率列，按倍率 ÷ 充值比例计算，支持排序并在窄屏保留为高优先级列。"
  - "v4-5 已新增账号聚焦组合详情卡；点击账号行可切换详情，队列切换会同步焦点。"
  - "v4-6 已在聚焦卡下补充更优候选池，可直接点选前 3 个候选分组。"
  - "v4-7 已在更优候选池下补充预算线输入，可按最终倍率阈值放宽/收紧候选显示。"
  - "v4-9 已修复历史记录误删风险；删除分组清理只隐藏提示并保留历史，真实历史不再提供一键清空。"
  - "v4-9 补充确认正式 userData 里仍有历史计数，并关闭了一个旧临时 userData 测试实例，避免误看临时数据。"
  - "v4-10 已新增只读数据中心视角，用于查看正式数据目录、站点/偏好计数和文件状态；不包含导入/恢复写入能力。"
  - "v4-11 已将桌面端 Sub2API 请求和站点诊断切到 Electron/Chromium net.fetch 注入，解决聪明哥这类 WAF 站点普通接口被 Node fetch 拦截的问题。"
  - "2026-07-19 已补充业务语义确认门禁：用户质疑账号/分组/成本/倍率等 UI 语义时，必须先给语义确认或思考确认，不能按 fast 直接改。"
  - "v4-13 已为账号当前组合最低补充 hover 明细，并在成本页用绿色区分售卖/所在分组、蓝色区分我的账号；推荐算法仍按当前组合最低与候选最终倍率比较，未变更成单分组基准。"
  - "v5 已移除聚焦账号卡里的站点余额，来源/成本状态改为 icon tag，分组 chip 单行滚动且 X 移除仍走组合确认；等待用户实机验收。"
  - "v6 已按用户截图复修账号聚焦卡，状态详情不再可见渲染，分组 chip 使用整行宽度，并重新打包 release/AIZZZWatch-darwin-arm64/AIZZZWatch.app。"
  - "lcodex 授权修复 v1 已完成：网页登录后若没有直接 localStorage/cookie JWT，会通过 session restore 自动拿 access token 并保存公开 api_base_url；用户需用桌面快捷入口实测真实账号登录自动关闭弹窗。"
  - "生产写入、签名、公证和自动更新未覆盖。"
  - "时间账本的精确成本依赖站点返回稳定使用记录 ID、账号 ID、发生时间和数值用量；缺少 provider 审计时间时使用应用观察时间。"
  - "费用归档按上海自然日替换同站点旧记录；单日 2,000 行上限会保留为部分覆盖，不作为完整收益口径。"
  - "内部自用用户仅按站点 ID + 顶层数字 user_id 本地标记；收益归档未返回 user_id 的记录不猜测归属，需重新归档含该字段的日期后才能精确排除。"
  - "自动上游关联只允许唯一 Key 指纹匹配；API 地址、子域名和倍率仅作诊断，不能推断成本来源。公益分组仅影响本机经营核算，原始账本与远端配置不变。"
residual_risks:
  - "不同 Sub2API 版本和 feature flag 可能需要适配。"
  - "最终发布包中的 Tray 行为仍需复测。"
  - "真实站点管理员 usage 字段和桌面端内部自用用户交互尚待用户验收。"
  - "macOS 锁屏阻断本轮公益开关、批量成本弹窗和首次观察中性状态的可见点击验证。"
