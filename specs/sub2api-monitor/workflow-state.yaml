    impact: high
  - version: "语义流程规则 v1"
    reason: "用户指出业务语义调整前未确认思考，选择方案 3：保留改动并补进项目流程规则。"
    impact: high
  - version: "站点角色与兼容修复 正式实施包 v1"
    reason: "用户确认处理 aihub 分组 404、聪明哥会话诊断，以及来源钱包三方站点/我的站点角色分离。"
    impact: high
  - version: "站点类型适配器 正式实施包 v1"
    reason: "用户确认按自动检测、Sub2API、NewAPI、自定义兼容分流读取契约，并保留角色独立语义。"
    impact: high
  - version: "费用归档正式实施包 v1"
    reason: "用户确认按上海自然日归档管理员用量，收益报告改读本地最小化账本，并明确显示分页上限覆盖状态。"
    impact: high
  - version: "价格榜使用中标记 语义确认 v1"
    reason: "用户确认按已精确关联的上游分组标记我的站点使用中状态，并排除多分组待确认关系。"
    impact: medium
  - version: "上游使用状态 v2"
    reason: "用户确认将价格榜使用状态切换为明确的使用中/未使用文案，并以主进程临时 Key 指纹唯一匹配补足安全自动关联。"
    impact: high
  - version: "价格榜最近涨降时间 思考确认 v1"
    reason: "用户确认在每条价格榜行的最终倍率下紧凑展示最近本地观察到的涨价和降价时间。"
    impact: medium
  - version: "价格榜最近涨降时间 思考确认 v2"
    reason: "用户纠正为只展示当前最新一次涨价或降价，并要求完整年月日时分秒，不显示另一方向的历史时间。"
    impact: medium
  - version: "用户自用排除经营核算 正式实施包 v1"
    reason: "用户澄清免计费对象是我的站点里的使用用户，不是上游账号；需要扩展本地最小化账本并改变经营收益口径。"
    impact: high
  - version: "接口适配中心 正式实施包 v1"
    reason: "用户确认将二开站路径与返回字段映射迁移至独立数据接入工作区，并限定为同源 HTTPS 只读映射。"
    impact: high
  - version: "上游关联诊断与自动配对 正式实施包 v1"
    reason: "用户确认将上游使用状态扩展为可诊断、候选预览确认和短暂读取失败保留，避免多站点同倍率误归因。"
    impact: high
  - version: "开源发布正式实施包 v1"
    reason: "用户确认公开 GitHub 仓库、MIT 协议、赞助收款码、macOS arm64 下载包与 GitHub Release；发布前必须完成本机数据脱敏和公开素材审计。"
