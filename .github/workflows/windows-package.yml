name: Package Windows EXE

on:
  push:
    branches:
      - featuew/cross-platform-packaging
    paths:
      - .github/workflows/windows-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    name: Build NSIS installer (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer without publishing
        run: npm run package:win

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: AIZZZWatch-win-x64-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
